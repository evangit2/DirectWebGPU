name: Deploy live demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble static site
        run: python3 deploy/build_public.py

      - name: Verify asset integrity
        run: |
          test -f deploy/public/index.html
          test -f deploy/public/build-manifest.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to Cloudflare Workers
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret not set; validated build only"
            exit 0
          fi
          CLOUDFLARE_API_TOKEN="$CF_TOKEN" npx wrangler deploy
        working-directory: deploy
