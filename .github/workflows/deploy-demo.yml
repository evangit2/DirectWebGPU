name: Deploy live demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, demo-deploy]
    permissions:
      contents: read
    steps:
      - name: Pull latest into live checkout
        run: |
          cd /home/evan/DirectWebGPU
          git fetch origin main
          git reset --hard origin/main
          git clean -fd --exclude='web/generated' || true

      - name: Restart demo server
        run: |
          cd /home/evan/DirectWebGPU
          pkill -f "scripts/serve.py" || true
          sleep 1
          nohup python3 scripts/serve.py 8765 >/tmp/humus-serve.log 2>&1 &
          sleep 2
          curl -fsS -o /dev/null -w "local %{http_code}\n" http://127.0.0.1:8765/

      - name: Verify public site
        run: |
          sleep 2
          B=https://atlas-node.tail5dadfe.ts.net
          code=$(curl -fsS -o /dev/null -w "%{http_code}" "$B/") || code=failed
          echo "index: $code"
          [ "$code" = "200" ] || { echo "::error::public site check failed"; exit 1; }
          curl -fsS -D - -o /dev/null "$B/" | tr -d '\r' | grep -qi "cross-origin-embedder-policy: require-corp" \
            || { echo "::error::cross-origin isolation headers missing"; exit 1; }
          echo "headers OK"