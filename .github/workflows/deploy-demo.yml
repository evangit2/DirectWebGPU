name: Deploy live demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble static site
        run: python3 deploy/build_public.py

      - name: Verify asset integrity
        run: |
          test -f deploy/public/index.html
          test -f deploy/public/build-manifest.json
          grep -q "4-hour" deploy/public/index.html && { echo "stray 4-hour button"; exit 1; } || true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to Cloudflare Workers
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
        working-directory: deploy

      - name: Skipped deploy notice
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret not set — build validated only. Set it to enable deploys."
